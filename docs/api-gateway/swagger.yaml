basePath: /
host: localhost:8080
info:
  contact: {}
  description: API Gateway for FCH messenger. All protected routes require JWT cookie.
  title: FCH API
  version: "1.0"
paths:
  /:
    get:
      description: Serves main search page
      produces:
      - text/html
      responses:
        "200":
          description: Main page
          schema:
            type: string
        "401":
          description: Unauthorized — missing or invalid JWT
      summary: Main page
      tags:
      - web
  /chat/{chatID}/send:
    get:
      description: |-
        Renders chat page for a specific chat
        Renders list of user's chats
        Creates or retrieves a personal chat with another user
        Group chat creation page (GET) or submission (POST)
        Join a group chat via invite code
        Upgrades to WebSocket for real-time messaging
      parameters:
      - description: Group name (POST only)
        in: formData
        name: group_name
        type: string
      - description: Invite code
        in: query
        name: code
        required: true
        type: string
      - description: Chat ID
        in: path
        name: chatID
        required: true
        type: integer
      produces:
      - text/html
      - text/html
      - text/html
      - text/html
      - text/html
      responses:
        "101":
          description: Switching protocols to WebSocket
        "200":
          description: Group create form
          schema:
            type: string
        "302":
          description: Redirect to /chat/{groupID}
        "400":
          description: Invalid or expired invite code
        "401":
          description: Unauthorized — missing or invalid JWT
        "403":
          description: Access denied — user not in chat
      summary: WebSocket chat connection
      tags:
      - chat
      - chat
      - chat
      - chat
      - chat
      - chat
