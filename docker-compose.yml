services:
  api-gateway:
    build:
      context: .
      dockerfile: cmd/api-gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      - user-service
      - web-service
      - chat-service

  web-service:
    build:
      context: .
      dockerfile: cmd/web-service/Dockerfile
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  user-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: cmd/user-service/Dockerfile
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  chat-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: cmd/chat-service/Dockerfile
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbUser -d my_db"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
