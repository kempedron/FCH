<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fch — Поиск</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f0f2ff;
                --card: #ffffff;
                --text: #1a1d2e;
                --muted: #6b7280;
                --accent: #4338ca;
                --accent-hover: #3730a3;
                --border: #e0e3f0;
                --shadow-sm: 0 2px 8px rgba(67, 56, 202, 0.07);
                --shadow: 0 8px 32px rgba(67, 56, 202, 0.1);
                --nav-h: 62px;
            }
            [data-theme="dark"] {
                --bg: #0d0f1e;
                --card: #161929;
                --text: #e8eaf6;
                --muted: #8b91b5;
                --accent: #6366f1;
                --accent-hover: #818cf8;
                --border: #252844;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100dvh;
                padding-bottom: var(--nav-h);
                transition:
                    background 0.3s,
                    color 0.3s;
            }

            .blob {
                position: fixed;
                border-radius: 50%;
                filter: blur(90px);
                opacity: 0.28;
                pointer-events: none;
                z-index: 0;
            }
            .blob-1 {
                width: 500px;
                height: 500px;
                background: #818cf8;
                top: -180px;
                left: -100px;
            }
            .blob-2 {
                width: 350px;
                height: 350px;
                background: #a78bfa;
                bottom: 70px;
                right: -80px;
            }

            .container {
                max-width: 680px;
                margin: 0 auto;
                padding: 24px 16px;
                position: relative;
                z-index: 1;
            }

            header {
                margin-bottom: 28px;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 10px;
                text-decoration: none;
                color: inherit;
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                background: var(--accent);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-weight: 700;
                font-size: 17px;
            }
            .logo-name {
                font-size: 19px;
                font-weight: 700;
                letter-spacing: -0.5px;
            }

            .icon-btn {
                width: 38px;
                height: 38px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--card);
                color: var(--text);
                cursor: pointer;
                font-size: 17px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    border-color 0.2s,
                    transform 0.15s;
            }
            .icon-btn:hover {
                border-color: var(--accent);
                transform: scale(1.06);
            }

            .search-wrap {
                display: flex;
                gap: 8px;
                background: var(--card);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                padding: 6px 6px 6px 14px;
                box-shadow: var(--shadow-sm);
                transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
            }
            .search-wrap:focus-within {
                border-color: var(--accent);
                box-shadow:
                    0 0 0 3px rgba(99, 102, 241, 0.12),
                    var(--shadow-sm);
            }
            .search-wrap input {
                flex: 1;
                border: none;
                background: transparent;
                color: var(--text);
                font-family: inherit;
                font-size: 15px;
                outline: none;
                min-width: 0;
            }
            .search-wrap input::placeholder {
                color: var(--muted);
            }

            .search-btn {
                padding: 9px 18px;
                border: none;
                border-radius: 10px;
                background: var(--accent);
                color: #fff;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 6px;
                white-space: nowrap;
                transition:
                    background 0.2s,
                    box-shadow 0.2s,
                    transform 0.15s;
            }
            .search-btn:hover {
                background: var(--accent-hover);
                box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            }
            .search-btn:active {
                transform: scale(0.97);
            }

            .status-bar {
                margin-top: 14px;
                font-size: 13px;
                color: var(--muted);
                min-height: 18px;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .status-bar.loading::before {
                content: "";
                width: 14px;
                height: 14px;
                border: 2px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
                flex-shrink: 0;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            #resultsList {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .user-card {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 14px 16px;
                border: 1px solid var(--border);
                border-radius: 14px;
                background: var(--card);
                text-decoration: none;
                color: inherit;
                box-shadow: var(--shadow-sm);
                transition:
                    border-color 0.2s,
                    transform 0.2s,
                    box-shadow 0.2s;
                animation: fadeIn 0.3s ease both;
            }
            .user-card:hover {
                border-color: var(--accent);
                transform: translateY(-2px);
                box-shadow: var(--shadow);
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .avatar {
                width: 44px;
                height: 44px;
                background: var(--accent);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                font-size: 18px;
                text-transform: uppercase;
                flex-shrink: 0;
            }
            .user-info {
                flex: 1;
                min-width: 0;
            }
            .user-info b {
                display: block;
                font-size: 15px;
                font-weight: 700;
            }
            .user-info span {
                font-size: 12px;
                color: var(--muted);
            }

            .chat-arrow {
                color: var(--accent);
                font-size: 20px;
                opacity: 0.6;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
            }
            .user-card:hover .chat-arrow {
                opacity: 1;
                transform: translateX(3px);
            }

            .empty-state {
                text-align: center;
                padding: 40px 20px;
                color: var(--muted);
                font-size: 14px;
            }
            .empty-state .emoji {
                font-size: 40px;
                margin-bottom: 10px;
            }

            /* ──────────────────────────────
           Bottom navigation bar
        ────────────────────────────── */
            .bottom-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: var(--nav-h);
                background: var(--card);
                border-top: 1px solid var(--border);
                display: flex;
                align-items: stretch;
                justify-content: center;
                z-index: 100;
                /* safe-area for iPhone home indicator */
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            .nav-inner {
                width: 100%;
                max-width: 680px;
                display: flex;
            }

            .nav-tab {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                text-decoration: none;
                color: var(--muted);
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.3px;
                cursor: pointer;
                border: none;
                background: none;
                font-family: inherit;
                padding: 8px 0 10px;
                position: relative;
                transition: color 0.2s;
                -webkit-tap-highlight-color: transparent;
            }
            .nav-tab svg {
                transition: transform 0.18s;
            }
            .nav-tab:hover {
                color: var(--accent);
            }
            .nav-tab:hover svg {
                transform: translateY(-2px);
            }

            /* Active indicator: pill on top */
            .nav-tab.active {
                color: var(--accent);
            }
            .nav-tab.active::before {
                content: "";
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 36px;
                height: 3px;
                background: var(--accent);
                border-radius: 0 0 4px 4px;
            }
            /* Active icon gets a soft tinted background disc */
            .nav-tab.active .nav-icon-wrap {
                background: rgba(99, 102, 241, 0.12);
                border-radius: 10px;
                padding: 4px 12px;
                margin: -4px -12px;
            }

            .nav-icon-wrap {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            @media (max-width: 480px) {
                .search-btn .btn-label {
                    display: none;
                }
                .search-btn {
                    padding: 9px 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>

        <div class="container">
            <header>
                <div class="topbar">
                    <a class="logo" href="/">
                        <div class="logo-icon">F</div>
                        <span class="logo-name">Fch</span>
                    </a>
                    <button class="icon-btn" id="themeBtn" title="Сменить тему">
                        🌙
                    </button>
                </div>

                <form id="searchForm">
                    <div class="search-wrap">
                        <input
                            id="searchInput"
                            type="text"
                            placeholder="Найти пользователя по username..."
                            required
                            autocomplete="off"
                        />
                        <button type="submit" class="search-btn">
                            <svg
                                width="15"
                                height="15"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                            <span class="btn-label">Найти</span>
                        </button>
                    </div>
                </form>

                <div class="status-bar" id="statusLabel"></div>
            </header>

            <main id="resultsList"></main>
        </div>

        <!-- ── Bottom Nav ── -->
        <nav class="bottom-nav" aria-label="Основная навигация">
            <div class="nav-inner">
                <!-- Поиск (active) -->
                <a href="/" class="nav-tab active" title="Поиск пользователей">
                    <span class="nav-icon-wrap">
                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                        </svg>
                    </span>
                    Поиск
                </a>

                <!-- Мои чаты -->
                <a href="/my-chats" class="nav-tab" title="Мои чаты">
                    <span class="nav-icon-wrap">
                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                            />
                        </svg>
                    </span>
                    Мои чаты
                </a>
            </div>
        </nav>

        <script>
            const resultsList = document.getElementById("resultsList");
            const statusLabel = document.getElementById("statusLabel");
            const searchInput = document.getElementById("searchInput");
            const themeBtn = document.getElementById("themeBtn");

            function renderResults(data) {
                resultsList.innerHTML = "";
                const users = Array.isArray(data)
                    ? data
                    : data.ID
                      ? [data]
                      : [];
                if (users.length === 0) {
                    resultsList.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🔍</div>
                        <p>Пользователь не найден</p>
                    </div>`;
                    return;
                }
                resultsList.innerHTML = users
                    .map(
                        (user, i) => `
                <a href="/start-chat/${user.ID}" class="user-card" style="animation-delay:${i * 60}ms">
                    <div class="avatar">${user.Username[0]}</div>
                    <div class="user-info">
                        <b>${user.Username}</b>
                        <span>Начать чат</span>
                    </div>
                    <span class="chat-arrow">→</span>
                </a>
            `,
                    )
                    .join("");
            }

            async function performSearch(username) {
                try {
                    statusLabel.className = "status-bar loading";
                    statusLabel.textContent = "Поиск...";
                    resultsList.innerHTML = "";
                    const response = await fetch(
                        `/search/${encodeURIComponent(username)}`,
                        {
                            method: "GET",
                            headers: { Accept: "application/json" },
                        },
                    );
                    if (response.status === 404) {
                        statusLabel.className = "status-bar";
                        statusLabel.textContent = "";
                        renderResults([]);
                        return;
                    }
                    if (!response.ok) throw new Error("Ошибка сервера");
                    const userData = await response.json();
                    renderResults(userData);
                    statusLabel.className = "status-bar";
                    statusLabel.textContent = "Результаты:";
                } catch (err) {
                    console.error(err);
                    statusLabel.className = "status-bar";
                    statusLabel.textContent = "Не удалось выполнить поиск";
                }
            }

            document.getElementById("searchForm").onsubmit = (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) performSearch(query);
            };

            themeBtn.onclick = () => {
                const html = document.documentElement;
                const isDark = html.dataset.theme === "dark";
                html.dataset.theme = isDark ? "light" : "dark";
                themeBtn.textContent = isDark ? "🌙" : "☀️";
            };
        </script>
    </body>
</html>
