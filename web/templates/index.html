<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fch — Поиск</title>

        <style>
            :root {
                --bg: #f7f9fb;
                --card: #fff;
                --text: #1f2933;
                --muted: #6b7280;
                --accent: #4f46e5;
                --border: #e5e7eb;
            }
            [data-theme="dark"] {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #e5e7eb;
                --muted: #94a3b8;
                --accent: #6366f1;
                --border: #334155;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
            }

            .container {
                max-width: 720px;
                margin: auto;
                padding: 16px;
            }

            header {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 20px;
            }
            .top {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .toggle {
                border: 1px solid var(--border);
                background: var(--card);
                padding: 8px 12px;
                border-radius: 8px;
                cursor: pointer;
                color: var(--text);
                font-size: 18px;
            }

            form {
                display: flex;
                gap: 8px;
            }
            input {
                flex: 1;
                padding: 12px 16px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--card);
                color: var(--text);
                outline: none;
                transition: border-color 0.2s;
            }
            input:focus {
                border-color: var(--accent);
            }
            button.search-btn {
                padding: 10px 20px;
                border: none;
                border-radius: 10px;
                background: var(--accent);
                color: #fff;
                cursor: pointer;
                font-weight: 600;
            }

            .status {
                font-size: 14px;
                color: var(--muted);
                min-height: 20px;
            }

            .user-card {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 16px;
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--card);
                text-decoration: none;
                color: inherit;
                margin-top: 10px;
                transition:
                    transform 0.2s,
                    border-color 0.2s;
            }
            .user-card:hover {
                border-color: var(--accent);
                transform: translateY(-2px);
            }
            .avatar {
                width: 40px;
                height: 40px;
                background: var(--accent);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                text-transform: uppercase;
            }
            .user-info b {
                display: block;
                font-size: 16px;
            }
            .user-info span {
                font-size: 13px;
                color: var(--muted);
            }

            @media (max-width: 480px) {
                form {
                    flex-direction: column;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <header>
                <div class="top">
                    <h2>Fch</h2>
                    <button class="toggle" id="themeBtn">🌙</button>
                </div>

                <form id="searchForm">
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Введите username пользователя..."
                        required
                    />
                    <button type="submit" class="search-btn">
                        <span>Найти</span>
                    </button>
                </form>

                <div class="status" id="statusLabel"></div>
            </header>

            <main id="resultsList"></main>
        </div>

        <script>
            const resultsList = document.getElementById("resultsList");
            const statusLabel = document.getElementById("statusLabel");
            const searchInput = document.getElementById("searchInput");
            const themeBtn = document.getElementById("themeBtn");

            // Функция отрисовки (предполагаем, что бэкенд возвращает объект пользователя или массив)
            function renderResults(data) {
                resultsList.innerHTML = "";

                // Если пришел один объект (не массив), превращаем в массив для единообразия
                const users = Array.isArray(data)
                    ? data
                    : data.ID
                      ? [data]
                      : [];

                if (users.length === 0) {
                    resultsList.innerHTML =
                        '<div class="status">Пользователь не найден</div>';
                    return;
                }

                resultsList.innerHTML = users
                    .map(
                        (user) => `
                        <a href="/chat/${user.ID}" class="user-card">
                            <div class="avatar">${user.Username[0]}</div>
                            <div class="user-info">
                                <b>${user.Username}</b>
                                <span>Нажмите, чтобы начать чат</span>
                            </div>
                        </a>
                    `,
                    )
                    .join("");
            }

            async function performSearch(username) {
                try {
                    statusLabel.textContent = "Ищем " + username + "...";
                    resultsList.innerHTML = "";

                    // Запрос на GET /search/{username}
                    const response = await fetch(
                        `/search/${encodeURIComponent(username)}`,
                        {
                            method: "GET",
                            headers: {
                                Accept: "application/json",
                            },
                        },
                    );

                    if (response.status === 404) {
                        statusLabel.textContent = "Пользователь не найден";
                        renderResults([]);
                        return;
                    }

                    if (!response.ok) throw new Error("Ошибка сервера");

                    const userData = await response.json();
                    renderResults(userData);
                    statusLabel.textContent = "Результаты поиска:";
                } catch (err) {
                    console.error(err);
                    statusLabel.textContent = "Не удалось выполнить поиск";
                }
            }

            // Обработка формы
            document.getElementById("searchForm").onsubmit = (e) => {
                e.preventDefault();
                const query = searchInput.value.trim();
                if (query) {
                    performSearch(query);
                }
            };

            // Переключение темы
            themeBtn.onclick = () => {
                const html = document.documentElement;
                const isDark = html.dataset.theme === "dark";
                html.dataset.theme = isDark ? "light" : "dark";
                themeBtn.textContent = isDark ? "🌙" : "☀️";
            };
        </script>
    </body>
</html>
