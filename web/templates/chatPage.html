<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Чат</title>
        <style>
            :root {
                --bg: #f7f9fb;
                --card: #fff;
                --text: #1f2933;
                --muted: #6b7280;
                --accent: #4f46e5;
                --border: #e5e7eb;
                --bubble-in: #fff;
                --bubble-out: #4f46e5;
                --bubble-out-text: #fff;
            }
            [data-theme="dark"] {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #e5e7eb;
                --muted: #94a3b8;
                --accent: #6366f1;
                --border: #334155;
                --bubble-in: #1e293b;
                --bubble-out: #6366f1;
                --bubble-out-text: #fff;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--text);
                height: 100dvh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }
            .back-btn {
                text-decoration: none;
                color: var(--accent);
                font-size: 20px;
            }
            .chat-info {
                flex: 1;
                min-width: 0;
            }
            .chat-info h2 {
                font-size: 16px;
                font-weight: 600;
            }
            .main-layout {
                display: flex;
                flex: 1;
                overflow: hidden;
            }
            .sidebar {
                width: 240px;
                border-right: 1px solid var(--border);
                background: var(--card);
                transition: width 0.3s;
            }
            .sidebar.hidden {
                width: 0;
                overflow: hidden;
                border-right: none;
            }
            .chat-area {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            .messages {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .msg {
                display: flex;
                flex-direction: column;
                max-width: 75%;
            }
            .msg.out {
                align-self: flex-end;
                align-items: flex-end;
            }
            .msg.in {
                align-self: flex-start;
                align-items: flex-start;
            }
            .bubble {
                padding: 8px 14px;
                border-radius: 14px;
                font-size: 14px;
                line-height: 1.4;
            }
            .msg.in .bubble {
                background: var(--bubble-in);
                border: 1px solid var(--border);
                border-bottom-left-radius: 4px;
            }
            .msg.out .bubble {
                background: var(--bubble-out);
                color: var(--bubble-out-text);
                border-bottom-right-radius: 4px;
            }
            .time {
                font-size: 10px;
                color: var(--muted);
                margin-top: 2px;
            }
            .input-bar {
                padding: 12px 16px;
                background: var(--card);
                border-top: 1px solid var(--border);
                display: flex;
                gap: 8px;
            }
            textarea {
                flex: 1;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: var(--bg);
                color: var(--text);
                resize: none;
                height: 40px;
            }
            .send-btn {
                padding: 0 20px;
                border: none;
                border-radius: 8px;
                background: var(--accent);
                color: #fff;
                cursor: pointer;
                font-weight: 600;
            }
            .empty {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <header>
            <a href="/" class="back-btn">←</a>
            <div class="chat-info">
                <h2 id="chatTitle">Чат #{{.Chat.ID}}</h2>
                <span id="statusText">Загрузка...</span>
            </div>
            <div class="header-actions">
                <button
                    class="send-btn"
                    style="
                        background: none;
                        color: var(--text);
                        border: 1px solid var(--border);
                    "
                    id="sidebarToggle"
                >
                    👥
                </button>
                <button
                    class="send-btn"
                    style="
                        background: none;
                        color: var(--text);
                        border: 1px solid var(--border);
                    "
                    id="themeBtn"
                >
                    🌙
                </button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar" id="sidebar">
                <div
                    style="
                        padding: 16px;
                        font-weight: bold;
                        border-bottom: 1px solid var(--border);
                    "
                >
                    Участники
                </div>
                <div id="memberList" style="padding: 8px">
                    {{range .Chat.Participants}}
                    <div
                        style="
                            padding: 8px;
                            display: flex;
                            align-items: center;
                            gap: 8px;
                        "
                    >
                        <div
                            style="
                                width: 30px;
                                height: 30px;
                                background: var(--accent);
                                color: white;
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 12px;
                            "
                        >
                            {{firstChar .User.Username}}
                        </div>
                        <span>{{.User.Username}}</span>
                    </div>
                    {{end}}
                </div>
            </aside>

            <div class="chat-area">
                <div class="messages" id="messages">
                    {{if not .Chat.Messages}}
                    <div class="empty">
                        <div style="font-size: 40px">💬</div>
                        <p>Сообщений пока нет</p>
                    </div>
                    {{else}} {{$myID := .MyID}} {{range .Chat.Messages}}
                    <div
                        class="msg {{if eq .AuthorID $myID}}out{{else}}in{{end}}"
                    >
                        <div class="bubble">{{.Content}}</div>
                        <div class="time">{{.CreatedAt.Format "15:04"}}</div>
                    </div>
                    {{end}} {{end}}
                </div>

                <div class="input-bar">
                    <textarea
                        id="msgInput"
                        placeholder="Напишите сообщение..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn">Отправить</button>
                </div>
            </div>
        </div>

        <script>
            // Инициализация данных из Go
            const myID = Number("{{.MyID}}");
            const chatID = Number("{{.Chat.ID}}");

            // Проверка на ошибку рендеринга
            if (chatID === 0) {
                console.error("CRITICAL ERROR: Chat ID is 0. Check Go Handler logic.");
                document.getElementById("statusText").innerText = "Ошибка ID чата";
            }

            // Определение получателя
            const participants = [
                {{range .Chat.Participants}}{ id: Number("{{.UserID}}") },{{end}}
            ];
            const opponent = participants.find(p => p.id !== myID);
            const recipientID = opponent ? opponent.id : 0;

            console.log(`Debug: MyID=${myID}, ChatID=${chatID}, RecipientID=${recipientID}`);

            // WebSocket через Gateway
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socketURL = `${protocol}//${window.location.host}/chat/${chatID}/send`;
            const socket = new WebSocket(socketURL);

            const messagesContainer = document.getElementById("messages");
            const msgInput = document.getElementById("msgInput");
            const sendBtn = document.getElementById("sendBtn");

            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            socket.onopen = () => {
                console.log("WS Connected");
                document.getElementById("statusText").innerText = "В сети";
            };

            socket.onclose = () => {
                document.getElementById("statusText").innerText = "Соединение закрыто";
            };

            socket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    appendMessage(msg);
                } catch (e) { console.error("Parse error", e); }
            };

            function appendMessage(msg) {
                const sID = msg.sender_id || msg.SenderID || msg.AuthorID;
                const content = msg.content || msg.Content;
                if (!content) return;

                const isMine = Number(sID) === myID;
                const msgDiv = document.createElement("div");
                msgDiv.className = `msg ${isMine ? 'out' : 'in'}`;

                const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                msgDiv.innerHTML = `<div class="bubble">${content}</div><div class="time">${timeStr}</div>`;

                const empty = messagesContainer.querySelector('.empty');
                if (empty) empty.remove();

                messagesContainer.appendChild(msgDiv);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            function sendMsg() {
                const content = msgInput.value.trim();
                if (!content || socket.readyState !== WebSocket.OPEN) return;

                const payload = {
                    recipient_id: recipientID,
                    content: content
                };

                socket.send(JSON.stringify(payload));
                msgInput.value = "";
            }

            sendBtn.onclick = sendMsg;
            msgInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
            document.getElementById("sidebarToggle").onclick = () => document.getElementById("sidebar").classList.toggle("hidden");
            document.getElementById("themeBtn").onclick = () => {
                const html = document.documentElement;
                const isDark = html.getAttribute("data-theme") === "dark";
                html.setAttribute("data-theme", isDark ? "light" : "dark");
                document.getElementById("themeBtn").innerText = isDark ? "🌙" : "☀️";
            };
        </script>
    </body>
</html>
