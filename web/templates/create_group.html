<!doctype html>
<html lang="ru" data-theme="light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Создать группу</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f0f2ff;
                --card: #ffffff;
                --text: #1a1d2e;
                --muted: #6b7280;
                --accent: #4338ca;
                --accent-hover: #3730a3;
                --border: #e0e3f0;
                --input-bg: #f7f8ff;
                --shadow-sm: 0 4px 12px rgba(67, 56, 202, 0.08);
                --nav-h: 62px;
            }
            [data-theme="dark"] {
                --bg: #0d0f1e;
                --card: #161929;
                --text: #e8eaf6;
                --muted: #8b91b5;
                --accent: #6366f1;
                --accent-hover: #818cf8;
                --border: #252844;
                --input-bg: #1a1d35;
            }

            body {
                font-family: "Plus Jakarta Sans", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                margin: 0;
                transition: background 0.3s;
            }

            header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 16px;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .back-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--bg);
                text-decoration: none;
                color: var(--text);
                cursor: pointer;
            }

            .container {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                padding: 40px 20px;
                gap: 20px;
            }

            .create-card {
                background: var(--card);
                width: 100%;
                max-width: 400px;
                padding: 32px;
                border-radius: 24px;
                box-shadow: var(--shadow-sm);
                border: 1px solid var(--border);
                box-sizing: border-box;
            }

            .create-card h1 {
                font-size: 20px;
                font-weight: 700;
                margin: 0 0 8px 0;
                text-align: center;
            }

            .create-card p {
                color: var(--muted);
                font-size: 14px;
                text-align: center;
                margin: 0 0 24px 0;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 8px;
                color: var(--muted);
            }

            .input-field {
                width: 100%;
                background: var(--input-bg);
                border: 1.5px solid var(--border);
                border-radius: 12px;
                padding: 12px 16px;
                color: var(--text);
                font-family: inherit;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s;
                box-sizing: border-box;
            }

            .input-field:focus {
                border-color: var(--accent);
            }

            textarea.input-field {
                resize: none;
                min-height: 80px;
            }

            .submit-btn {
                width: 100%;
                background: var(--accent);
                color: white;
                border: none;
                padding: 14px;
                border-radius: 12px;
                font-family: inherit;
                font-weight: 600;
                font-size: 15px;
                cursor: pointer;
                transition:
                    background 0.2s,
                    transform 0.15s;
            }

            .submit-btn:hover {
                background: var(--accent-hover);
            }

            .submit-btn:active {
                transform: scale(0.98);
            }

            .bottom-nav {
                height: var(--nav-h);
                background: var(--card);
                border-top: 1px solid var(--border);
                display: flex;
                justify-content: center;
            }

            .nav-inner {
                width: 100%;
                max-width: 680px;
                display: flex;
            }

            .nav-tab {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                color: var(--muted);
                font-size: 13px;
                font-weight: 500;
            }

            .chat-meta h2 {
                margin: 0;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <header>
            <a href="/my-chats" class="back-btn">
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </a>
            <div class="chat-meta" style="flex: 1">
                <h2>Новая группа</h2>
            </div>
            <button
                class="icon-btn"
                id="themeBtn"
                style="
                    border: none;
                    background: none;
                    cursor: pointer;
                    font-size: 18px;
                "
            >
                🌙
            </button>
        </header>

        <div class="container">
            <div class="create-card">
                <h1>Создание группы</h1>
                <p>Укажите название и описание для вашего нового сообщества</p>

                <form action="/group-chat/create" method="POST">
                    <div class="form-group">
                        <label for="group_name">Название группы</label>
                        <input
                            type="text"
                            id="group_name"
                            name="group_name"
                            class="input-field"
                            placeholder="Например: Коллеги по проекту"
                            required
                            maxlength="255"
                        />
                    </div>

                    <div class="form-group">
                        <label for="description"
                            >Описание (необязательно)</label
                        >
                        <textarea
                            id="description"
                            name="description"
                            class="input-field"
                            placeholder="О чем этот чат?"
                        ></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        Создать группу
                    </button>
                </form>
            </div>

            <div class="create-card" id="inviteSection" style="padding: 24px">
                <label
                    style="
                        font-size: 13px;
                        font-weight: 600;
                        color: var(--muted);
                        display: block;
                        margin-bottom: 12px;
                    "
                >
                    Пригласительная ссылка
                </label>
                <div style="display: flex; gap: 8px">
                    <input
                        type="text"
                        id="inviteUrl"
                        class="input-field"
                        style="font-size: 12px; padding: 8px 12px"
                        readonly
                        value="Сначала создайте группу"
                    />
                    <button
                        onclick="copyInviteLink(event)"
                        class="back-btn"
                        style="width: 44px; height: 44px; flex-shrink: 0"
                        title="Копировать"
                    >
                        📋
                    </button>
                </div>
                <p
                    style="
                        font-size: 11px;
                        margin: 12px 0 0 0;
                        text-align: left;
                        line-height: 1.4;
                    "
                >
                    Отправьте эту ссылку друзьям. При переходе они автоматически
                    станут участниками группы.
                </p>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-inner">
                <a href="/" class="nav-tab">Поиск</a>
                <a href="/my-chats" class="nav-tab">Мои чаты</a>
            </div>
        </nav>

        <script>
            // 1. Тема оформления
            const themeBtn = document.getElementById("themeBtn");
            themeBtn.onclick = () => {
                const html = document.documentElement;
                const isDark = html.dataset.theme === "dark";
                html.dataset.theme = isDark ? "light" : "dark";
                themeBtn.textContent = isDark ? "🌙" : "☀️";
            };

            // 2. Генерация ссылки
            // Если ты передаешь данные через шаблон Go, используй: const currentGroupID = "{{.GroupID}}";
            // Если через URL (например ?id=10), используй код ниже:
            const urlParams = new URLSearchParams(window.location.search);
            const groupIDFromUrl = urlParams.get("id");

            const inviteInput = document.getElementById("inviteUrl");

            if (groupIDFromUrl) {
                inviteInput.value =
                    window.location.origin +
                    "/group-chat/join-to-chat/" +
                    groupIDFromUrl;
            }

            // 3. Копирование
            async function copyInviteLink(event) {
                const copyText = document.getElementById("inviteUrl");

                if (copyText.value.includes("http")) {
                    try {
                        await navigator.clipboard.writeText(copyText.value);
                        const btn = event.currentTarget;
                        const originalEmoji = "📋";
                        btn.textContent = "✅";
                        setTimeout(() => {
                            btn.textContent = originalEmoji;
                        }, 2000);
                    } catch (err) {
                        console.error("Ошибка копирования:", err);
                    }
                } else {
                    alert("Ссылка еще не сформирована. Создайте группу.");
                }
            }
        </script>
    </body>
</html>
